<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 — FlowDesk</title>
<style>
:root{
  --brand:#4F46E5; --brand-hover:#4338CA; --on-brand:#fff;
  --surface:#fff; --surface-alt:#f8fafc; --fg:#0f172a; --muted:#64748b; --border:#e2e8f0;
  --radius:12px; --maxw:1120px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--fg);background:var(--surface-alt);line-height:1.6}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
section,header,footer{padding:80px 0}
h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.1;font-weight:700}
h2{font-size:2rem;font-weight:700;margin-bottom:8px}
h3{font-size:1.125rem;font-weight:600}
p{color:var(--muted)}
.btn{display:inline-block;padding:12px 24px;border-radius:var(--radius);font-weight:600;
  text-decoration:none;cursor:pointer;border:none;font-size:1rem;transition:background .15s}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:hover{background:var(--brand-hover)}
.btn-secondary{background:var(--surface);color:var(--fg);border:1px solid var(--border)}
.btn-ghost{background:transparent;color:var(--brand);text-decoration:none}
.grid{display:grid;gap:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
.alt{background:var(--surface-alt)}
.center{text-align:center}
.muted{color:var(--muted)}
input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);
  font-size:1rem;color:var(--fg);background:var(--surface);outline:none}
input:focus{border-color:var(--brand)}
label{display:block;font-size:.875rem;font-weight:500;margin-bottom:6px;color:var(--fg)}
.form-group{display:flex;flex-direction:column;gap:4px}
@media(max-width:768px){section,header,footer{padding:48px 0}}
</style>
</head>
<body>

<!-- Nav -->
<header data-section="nav" style="padding:20px 0;border-bottom:1px solid var(--border);background:var(--surface)">
  <div class="wrap" style="display:flex;align-items:center;justify-content:space-between">
    <strong style="font-size:1.25rem;color:var(--brand)">FlowDesk</strong>
    <nav style="display:flex;gap:16px;align-items:center">
      <span class="muted" style="font-size:.875rem">还没有账号？</span>
      <a href="#" class="btn btn-primary" style="padding:8px 20px;font-size:.875rem">免费注册</a>
    </nav>
  </div>
</header>

<!-- Form -->
<section data-section="form" style="padding:80px 0;min-height:calc(100vh - 130px);display:flex;align-items:center">
  <div class="wrap" style="width:100%">
    <div class="card" style="max-width:420px;margin:0 auto;padding:40px">

      <div class="center" style="margin-bottom:32px">
        <h2>欢迎回来</h2>
        <p style="margin-top:8px">登录你的 FlowDesk 账号</p>
      </div>

      <form style="display:flex;flex-direction:column;gap:20px">

        <div class="form-group">
          <label for="email">邮箱地址</label>
          <input type="email" id="email" placeholder="name@company.com">
        </div>

        <div class="form-group">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <label for="password" style="margin-bottom:0">密码</label>
            <a href="#" class="btn-ghost" style="font-size:.8rem">忘记密码？</a>
          </div>
          <input type="password" id="password" placeholder="••••••••">
        </div>

        <div style="display:flex;align-items:center;gap:8px">
          <input type="checkbox" id="remember" style="width:16px;height:16px;accent-color:var(--brand)">
          <label for="remember" style="margin-bottom:0;font-weight:400;cursor:pointer">记住我 30 天</label>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;font-size:1rem">
          登录
        </button>

      </form>

      <div style="margin-top:24px;text-align:center">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
          <div style="flex:1;height:1px;background:var(--border)"></div>
          <span class="muted" style="font-size:.8rem;white-space:nowrap">或使用以下方式登录</span>
          <div style="flex:1;height:1px;background:var(--border)"></div>
        </div>
        <div style="display:flex;gap:12px">
          <a href="#" class="btn btn-secondary" style="flex:1;text-align:center;padding:10px">
            Google
          </a>
          <a href="#" class="btn btn-secondary" style="flex:1;text-align:center;padding:10px">
            飞书
          </a>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- Footer -->
<footer data-section="footer" class="alt" style="padding:24px 0;border-top:1px solid var(--border)">
  <div class="wrap" style="display:flex;justify-content:space-between;align-items:center">
    <p style="font-size:.875rem">© 2026 FlowDesk Inc.</p>
    <div style="display:flex;gap:24px">
      <a href="#" class="muted" style="font-size:.875rem;text-decoration:none">隐私政策</a>
      <a href="#" class="muted" style="font-size:.875rem;text-decoration:none">服务条款</a>
      <a href="#" class="muted" style="font-size:.875rem;text-decoration:none">帮助</a>
    </div>
  </div>
</footer>

</body>
</html>
